// 3 — INTRODUÇÃO
{
  type:'text',
  kicker:'01 · Introdução',
  title:'O Contexto 4: logística reversa e devolução de produtos',
  html:`
    <p>O comércio eletrônico transformou a compra em um ato quase instantâneo: poucos toques separam o desejo de um produto da confirmação do pedido. Mas essa fluidez tem uma contraparte pouco explorada pelo design de interfaces — o momento em que a compra <strong>dá errado</strong>. O produto chega com defeito, em tamanho incorreto, diferente do anunciado, ou simplesmente o cliente se arrepende. É nesse ponto que entra a logística reversa, o processo de trazer o item de volta ao vendedor e devolver o valor pago ao consumidor.</p>
    <p>O Contexto 4, objeto deste seminário, trata exatamente desse fluxo, materializado no aplicativo fictício <strong>Buyitly</strong>. Diferentemente da jornada de compra, amplamente estudada e otimizada pelas empresas, a jornada de devolução costuma ser tratada como um apêndice do sistema: menos visível, menos polida, frequentemente terceirizada para um canal de atendimento humano lento e genérico.</p>
    <p>Nossa proposta parte de uma premissa simples, mas com implicações profundas para a IHC: se a compra é desenhada para gerar confiança e desejo, a devolução precisa ser desenhada para <em>preservar</em> essa confiança quando algo sai do previsto. É esse fluxo — solicitar, escolher o método de envio, acompanhar o status, lidar com uma exceção e, por fim, ser reembolsado — que analisamos e prototipamos ao longo desta apresentação.</p>`

{

  html:`
    <p>Um princípio central da Interação Humano-Computador é que as Tecnologias de Informação e Comunicação não são meras ferramentas neutras que executam tarefas predefinidas: elas <strong>transformam a prática social</strong> e reconfiguram rotinas inteiras. Quando um aplicativo de e-commerce se torna o único caminho possível para resolver um problema — como devolver um produto — a tecnologia deixa de apenas mediar a ação e passa a <em>governá-la</em>. O usuário não pode simplesmente "devolver o produto"; ele só pode fazer aquilo que a interface permite, na ordem que a interface impõe.</p>
    <p>É exatamente nesse ponto que reside a importância do Contexto 4. Um processo de devolução mal desenhado — com passos ambíguos, falta de feedback sobre o status do reembolso, ou barreiras artificiais como a exigência de contato telefônico — não é apenas um inconveniente pontual. Ele comunica ao usuário, de forma silenciosa mas eficaz, que a empresa não está genuinamente do seu lado no momento em que ele mais precisa de suporte.</p>
    <p>A confiança do consumidor em uma plataforma de e-commerce não se constrói apenas na experiência de compra bem-sucedida, mas sobretudo na forma como a plataforma responde quando as coisas <strong>não</strong> saem como esperado. Um fluxo de devolução frustrante quebra essa confiança de maneira desproporcional ao tamanho do problema original, porque revela como o sistema trata o usuário quando ele está em posição de vulnerabilidade.</p>`

// 6 — INTERESSES EM TENSÃO
{

  html:`
    <p>Nenhum sistema de devolução é neutro: cada decisão de design distribui custo e conveniência entre as partes envolvidas. De um lado, o <strong>usuário</strong> quer um reembolso rápido, sem atrito, sem precisar justificar-se extensivamente e, idealmente, sem sair de casa. Do outro, a <strong>empresa</strong> precisa manter controle sobre o processo: verificar se o produto realmente será devolvido em condições aceitáveis, mitigar fraudes (como devoluções de itens usados ou trocados) e minimizar o custo logístico de cada devolução, que muitas vezes supera o valor do produto.</p>
    <p>Esse é o cerne do que projetar uma interface de devolução realmente significa: <em>decidir quem ganha facilidade e quem assume o custo da ação</em>. Uma interface que exige múltiplas etapas de verificação protege a empresa, mas transfere carga cognitiva e tempo ao usuário. Uma interface que aprova reembolsos automaticamente protege o usuário, mas expõe a empresa a risco financeiro maior.</p>
    <p>O Buyitly, como veremos na prototipação, busca um meio-termo: automatiza o que pode ser automatizado com segurança (geração de código de postagem, acompanhamento por timeline) e reserva a intervenção humana para os casos de exceção genuína — como um problema no envio detectado apenas durante o transporte.</p>`

    <p>A literatura de IHC, a partir do conceito de <strong>Ação Situada</strong> proposto por Lucy Suchman, nos alerta contra tratar o usuário como uma entidade abstrata que segue planos racionais e lineares. Na prática, a ação humana é moldada momento a momento pelas circunstâncias concretas em que ocorre — e isso é particularmente verdadeiro no cenário de uma devolução.</p>
    <p>O usuário que abre o Buyitly para devolver um produto raramente está em um estado neutro. Ele frequentemente está <strong>frustrado</strong> (o produto não atendeu à expectativa), com <strong>pressa</strong> (quer resolver o problema entre uma tarefa e outra do dia) e <strong>inseguro</strong> (não sabe se vai realmente receber o dinheiro de volta, nem em quanto tempo). Esse estado emocional e temporal não é um detalhe periférico: ele deve orientar decisões centrais de design.</p>
    <p>Some-se a isso o fato de que grande parte dessas interações ocorre em contexto <strong>mobile</strong>, muitas vezes com distrações no ambiente — em pé, em um transporte público, entre outras tarefas. O princípio do Design Contextual reforça que entender esse cenário real de uso, e não apenas o fluxo idealizado em um fluxograma, é o que diferencia uma interface tecnicamente funcional de uma interface genuinamente utilizável.</p>`

{

  title:'Affordances, signifiers e feedback',
  html:`
    <p>Donald Norman distingue com precisão dois conceitos frequentemente confundidos: <strong>affordances</strong> são as possibilidades reais de ação que um objeto oferece, enquanto <strong>signifiers</strong> são os sinais perceptíveis que comunicam onde e como essa ação pode ocorrer. Um botão pode "afford" o clique, mas é sua cor, seu contorno e sua posição que sinalizam, ao usuário, que ali existe uma ação possível.</p>
    <p>No Buyitly, essa distinção aparece de forma sistemática: o botão de "Iniciar Devolução" utiliza cor e hierarquia visual consistentes com outras ações primárias do aplicativo, de modo que o usuário reconhece o padrão sem precisar aprendê-lo de novo a cada tela. As cores também carregam significado semântico estável — tons de âmbar ou amarelo para estados "em análise", tons de verde ou azul-petróleo para conclusão bem-sucedida — criando um vocabulário visual coerente que reduz a necessidade de leitura textual detalhada em cada etapa.</p>
    <p>O <strong>feedback</strong>, por fim, é o elo que fecha esse ciclo perceptivo: cada ação do usuário — confirmar um método de envio, enviar uma solicitação — é seguida por uma resposta visual imediata que confirma que o sistema recebeu e processou aquela ação, evitando o vácuo de incerteza que caracteriza interfaces mal projetadas.</p>`
},

  html:`
    <p>O modelo dos "golfos" (gulfs), também proposto por Norman, descreve as distâncias cognitivas que o usuário precisa atravessar ao interagir com um sistema. O <strong>golfo de execução</strong> é a distância entre a intenção do usuário e as ações concretas necessárias para realizá-la — quanto maior essa distância, mais o usuário precisa deduzir "o que fazer" para atingir seu objetivo. O <strong>golfo de avaliação</strong>, por sua vez, é a distância entre o estado atual do sistema e a compreensão que o usuário tem desse estado — quanto maior, mais o usuário precisa interpretar o que aconteceu.</p>
    <p>No fluxo do Buyitly, o golfo de execução é reduzido por meio de um design que <strong>guia o usuário passo a passo</strong>: cada tela apresenta uma única decisão clara a ser tomada (iniciar devolução, escolher método, confirmar), em vez de expor múltiplas opções simultâneas que exigiriam planejamento antecipado por parte do usuário.</p>
    <p>Já o golfo de avaliação é mitigado principalmente pela <strong>linha do tempo</strong> introduzida na tela "Em Análise" e pelo feedback constante em cada etapa. Ao tornar o estado interno do sistema — onde exatamente está a solicitação de devolução — visível e compreensível, a interface elimina a necessidade de o usuário inferir ou adivinhar o que está acontecendo "nos bastidores" do processo.</p>`

    <p>No caso do Buyitly, a metamensagem que o design comunica, do início ao fim do fluxo de devolução, pode ser resumida como: <strong>"nós cuidamos do seu problema de forma transparente, mesmo quando algo dá errado."</strong> Essa metamensagem se manifesta em decisões concretas — a notificação proativa por e-mail antes de qualquer ação exigida do usuário, a timeline que expõe o status real do processo, a linguagem direta e não-burocrática em cada tela.</p>

const TOTAL = slides.length;
let current = 0;
const deck = document.getElementById('deck');
const pagenum = document.getElementById('pagenum');
const progressBar = document.getElementById('progress-bar');

function renderImagesBlock(slide){
  const wrapClass = slide.singleImage ? 'img-row img-single' : 'img-row';
  const imgs = slide.images.map(im => `
    <figure class="img-block">
      <img src="${im.src}" alt="${im.alt}" loading="lazy">
      <figcaption>${im.caption}</figcaption>
    </figure>`).join('');
  return `<div class="${wrapClass}">${imgs}</div>`;
}

function buildSlideEl(slide, idx){
  const el = document.createElement('section');
  el.className = 'slide ' + (slide.type === 'cover' ? 'cover' : '');
  el.dataset.index = idx;

  if(slide.type === 'cover'){
    el.innerHTML = slide.html;
    return el;
  }

  let inner = `<div class="content-wrap">`;
  if(slide.kicker) inner += `<span class="kicker">${slide.kicker}</span>`;
  if(slide.title) inner += `<h2 class="slide-title">${slide.title}</h2>`;

  if(slide.type === 'toc' || slide.type === 'cards' || slide.type === 'criteria'){
    inner += slide.html;
  } else if(slide.type === 'text'){
    inner += `<div class="slide-body">${slide.html}</div>`;
  } else if(slide.type === 'images'){
    if(slide.figmaBanner) inner += `<div class="figma-banner">${slide.figmaBanner}</div>`;
    inner += `<div class="slide-body" style="margin-bottom:20px;">${slide.intro}</div>`;
    inner += renderImagesBlock(slide);
  } else if(slide.type === 'refs'){
    inner += `<div class="slide-body">${slide.html}</div>`;
    inner += `<div class="ref-box">${slide.refText}</div>`;
  }
  inner += `</div>`;
  el.innerHTML = inner;
  return el;
}

slides.forEach((s, i) => deck.appendChild(buildSlideEl(s, i)));
const slideEls = Array.from(document.querySelectorAll('.slide'));

function show(idx){
  if(idx < 0 || idx >= TOTAL) return;
  slideEls[current].classList.remove('active');
  current = idx;
  slideEls[current].classList.add('active');
  slideEls[current].scrollTop = 0;
  pagenum.textContent = (current + 1) + ' / ' + TOTAL;
  progressBar.style.width = ((current + 1) / TOTAL * 100) + '%';
}

function next(){ show(current + 1); }
function prev(){ show(current - 1); }

document.getElementById('zoneRight').addEventListener('click', next);
document.getElementById('zoneLeft').addEventListener('click', prev);

document.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if(k === 'd' || k === 'arrowright'){ e.preventDefault(); next(); }
  else if(k === 'a' || k === 'arrowleft'){ e.preventDefault(); prev(); }
});

show(0);
</script>
