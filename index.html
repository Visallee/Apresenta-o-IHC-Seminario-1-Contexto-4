<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buyitly — Contexto 4 | IHC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #121212;
        --bg-elev: #1b1b1f;
        --bg-elev-2: #202024;
        --ink: #ececee;
        --ink-soft: #a6a6ae;
        --ink-faint: #77777f;
        --line: #2b2b30;
        --teal: #4fd1c5;
        --teal-deep: #2fa79a;
        --amber: #e3a458;
        --amber-soft: #3a2e1e;
        --figma: #c9a7ff;
        font-size: 16px;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      body {
        font-family:
          "Inter",
          system-ui,
          -apple-system,
          sans-serif;
        background: var(--bg);
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
      }
      h1,
      h2,
      h3 {
        font-family: "Inter", system-ui, sans-serif;
        font-weight: 800;
        margin: 0;
        line-height: 1.14;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0;
      }

      #deck {
        position: relative;
        width: 100vw;
        height: 100vh;
      }
      .slide {
        position: absolute;
        inset: 0;
        display: none;
        padding: 6.5vh 7vw;
        overflow: hidden;
      }
      .slide.active {
        display: flex;
        flex-direction: column;
      }

      .content-wrap {
        flex: 1;
        min-height: 0;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: center;
        transform-origin: center center;
        width: 100%;
      }

      /* nav click zones */
      .zone {
        position: fixed;
        top: 0;
        bottom: 0;
        width: 50%;
        z-index: 5;
        cursor: pointer;
      }
      .zone.left {
        left: 0;
      }
      .zone.right {
        right: 0;
      }

      /* footer */
      #footer {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        height: 52px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 3vw;
        z-index: 10;
        pointer-events: none;
        font-size: 0.8rem;
        color: var(--ink-faint);
        letter-spacing: 0.02em;
      }
      #progress-track {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: var(--line);
        z-index: 11;
      }
      #progress-bar {
        height: 100%;
        background: var(--teal);
        width: 0%;
        transition: width 0.25s ease;
      }
      #pagenum {
        font-variant-numeric: tabular-nums;
        font-weight: 600;
        color: var(--ink-soft);
      }

      .kicker {
        display: inline-block;
        font-size: 0.82rem;
        font-weight: 700;
        color: var(--teal);
        letter-spacing: 0.04em;
        margin-bottom: 1.4vh;
      }
      .slide-title {
        font-size: 2.05rem;
        color: var(--ink);
        max-width: 900px;
        margin-bottom: 2.6vh;
      }
      .slide-body {
        max-width: 820px;
        font-size: 1.14rem;
        line-height: 1.66;
        color: var(--ink);
      }
      .slide-body p {
        margin-bottom: 1.15em;
      }
      .slide-body p:last-child {
        margin-bottom: 0;
      }
      .slide-body strong {
        color: var(--teal);
        font-weight: 700;
      }
      .slide-body em {
        font-style: italic;
        color: var(--ink-soft);
      }

      /* Emphasis / pull-quote slides (short synthesis paragraphs) */
      .emphasis-wrap {
        max-width: 760px;
      }
      .emphasis-wrap p {
        font-size: 1.85rem;
        line-height: 1.42;
        font-weight: 600;
        color: var(--ink);
        border-left: 4px solid var(--teal);
        padding-left: 32px;
      }
      .emphasis-wrap p strong {
        color: var(--teal);
      }
      .emphasis-wrap p em {
        color: var(--amber);
        font-style: italic;
      }

      /* Cover slide */
      .cover .content-wrap {
        justify-content: center;
        align-items: flex-start;
      }
      .cover .institute {
        font-size: 0.98rem;
        color: var(--ink-soft);
        margin-bottom: 3.2vh;
        letter-spacing: 0.02em;
      }
      .cover h1 {
        font-size: 2.85rem;
        max-width: 840px;
        margin-bottom: 2vh;
        color: var(--ink);
      }
      .cover .subtitle {
        font-size: 1.18rem;
        color: var(--teal);
        margin-bottom: 4.2vh;
        font-weight: 500;
      }
      .cover .meta-grid {
        display: grid;
        grid-template-columns: 140px 1fr;
        gap: 0.8vh 20px;
        font-size: 1rem;
        max-width: 660px;
      }
      .cover .meta-grid dt {
        color: var(--ink-faint);
      }
      .cover .meta-grid dd {
        margin: 0;
        font-weight: 600;
        color: var(--ink);
      }
      .cover .rule {
        width: 56px;
        height: 3px;
        background: var(--amber);
        margin: 3vh 0;
      }

      /* Figma text links (not buttons) */
      .link-figma {
        position: relative;
        z-index: 20;
        display: inline-block;
        color: var(--figma);
        font-weight: 700;
        font-size: 1.05rem;
        text-decoration: underline;
        text-decoration-color: var(--figma);
        text-decoration-thickness: 2px;
        text-underline-offset: 5px;
        transition:
          color 0.15s ease,
          text-decoration-color 0.15s ease,
          opacity 0.15s ease;
      }
      .link-figma:hover {
        color: #e4d4ff;
        text-decoration-color: #e4d4ff;
      }
      .cover .figma-cta {
        margin-top: 1vh;
      }
      .figma-banner-text {
        position: relative;
        z-index: 15;
        border-left: 3px solid var(--figma);
        background: rgba(201, 167, 255, 0.08);
        padding: 1.6vh 26px;
        margin-bottom: 3vh;
        max-width: 820px;
        border-radius: 0 8px 8px 0;
      }
      .figma-banner-text p {
        margin: 0 0 0.8vh 0;
        font-size: 0.98rem;
        color: var(--ink-soft);
      }
      .figma-banner-text p:last-child {
        margin-bottom: 0;
      }

      /* Sumario */
      .toc-list {
        list-style: none;
        margin: 0;
        padding: 0;
        max-width: 780px;
        display: grid;
        gap: 1.4vh;
      }
      .toc-list li {
        display: flex;
        align-items: baseline;
        gap: 18px;
        font-size: 1.1rem;
        padding-bottom: 1.4vh;
        border-bottom: 1px solid var(--line);
      }
      .toc-list .num {
        font-size: 1.05rem;
        color: var(--amber);
        font-weight: 700;
        min-width: 26px;
      }
      .toc-list .lbl {
        color: var(--ink);
        font-weight: 600;
      }
      .toc-list .sub {
        color: var(--ink-faint);
        font-size: 0.9rem;
        font-weight: 400;
        display: block;
        margin-top: 2px;
      }

      /* Definition / stakeholder cards */
      .card-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        max-width: 940px;
      }
      .card {
        border: 1px solid var(--line);
        background: var(--bg-elev);
        border-radius: 10px;
        padding: 2.2vh 22px;
      }
      .card h3 {
        font-size: 1.05rem;
        color: var(--teal);
        margin-bottom: 1vh;
        font-weight: 700;
      }
      .card p {
        font-size: 0.96rem;
        color: var(--ink-soft);
        margin: 0;
        line-height: 1.5;
      }

      /* Criteria table */
      .crit-intro {
        font-size: 1.02rem;
        color: var(--ink-soft);
        max-width: 820px;
        margin-bottom: 2.6vh;
        line-height: 1.55;
      }
      .crit-list {
        display: grid;
        gap: 1.2vh;
        max-width: 900px;
      }
      .crit-row {
        display: grid;
        grid-template-columns: 210px 1fr;
        gap: 20px;
        padding: 1.3vh 0;
        border-bottom: 1px solid var(--line);
        align-items: start;
      }
      .crit-row .label {
        font-weight: 700;
        color: var(--teal);
        font-size: 1.02rem;
      }
      .crit-row .desc {
        font-size: 0.98rem;
        color: var(--ink);
        line-height: 1.5;
      }

      /* Image feature slides — images as the hero */
      .img-feature-header {
        margin-bottom: 2vh;
      }
      .img-feature-row {
        display: flex;
        gap: 4vw;
        align-items: center;
        justify-content: center;
        flex: 1;
        min-height: 0;
        width: 100%;
      }
      .img-feature-block {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.6vh;
        min-width: 0;
        max-width: 44vw;
      }
      .img-feature-block.single {
        max-width: 56vw;
      }
      .img-feature-block img {
        max-height: 66vh;
        max-width: 100%;
        width: auto;
        object-fit: contain;
        border-radius: 12px;
        background: #fff;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
      }
      .img-feature-block figcaption {
        font-size: 1.05rem;
        font-weight: 700;
        color: var(--ink);
        letter-spacing: 0.01em;
      }

      /* Reference slide */
      .ref-box {
        border-left: 4px solid var(--amber);
        background: var(--amber-soft);
        padding: 2.4vh 26px;
        max-width: 780px;
        font-style: italic;
        font-size: 1.08rem;
        color: var(--ink);
        line-height: 1.55;
        border-radius: 0 8px 8px 0;
      }
      .refs-lead {
        font-size: 1.1rem;
        color: var(--ink-soft);
        max-width: 780px;
        margin-bottom: 3vh;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div id="progress-track"><div id="progress-bar"></div></div>
    <div class="zone left" id="zoneLeft" aria-label="Slide anterior"></div>
    <div class="zone right" id="zoneRight" aria-label="Próximo slide"></div>
    <div id="deck"></div>
    <div id="footer">
      <span id="footer-left">Buyitly · Contexto 4 · IHC</span>
      <span id="pagenum">1 / 1</span>
    </div>

    <script>
      const FIGMA_URL =
        "https://www.figma.com/make/Fuj4oSMqM8DqFP4CnJZigg/Buyitly---IHC-Juno-C4?code-node-id=0-6&p=f&t=fU9dZR1tnpxUW71F-0&fullscreen=1";
      const figmaLink = (label) =>
        `<a class="link-figma" href="${FIGMA_URL}" target="_blank" rel="noopener noreferrer">${label}</a>`;

      const slides = [
        // 1 — CAPA
        {
          type: "cover",
          html: `
  <div class="content-wrap">
    <div class="institute">Instituto Federal de Sergipe — IFS</div>
    <h1>Análise e Prototipação do Contexto 4:<br>o Fluxo de Devolução de E-commerce</h1>
    <div class="subtitle">Seminário 1 — Buyitly, um aplicativo de logística reversa centrado no usuário</div>
    <div class="rule"></div>
    <dl class="meta-grid">
      <dt>Disciplina</dt><dd>Introdução à Interação Humano-Computador</dd>
      <dt>Orientador</dt><dd>Prof. Dr. Juno Vitorino</dd>
      <dt>Alunos</dt><dd>Victor Silva do Valle · Lucas Emanuel Dias dos Santos Oliveira</dd>
    </dl>
    <div class="figma-cta">${figmaLink("Acessar Protótipo Funcional no Figma")}</div>
  </div>`,
        },

        // 2 — SUMÁRIO
        {
          type: "toc",
          kicker: "Roteiro",
          title: "Sumário",
          html: `
  <ol class="toc-list">
    <li><span class="num">01</span><span class="lbl">Introdução ao Contexto 4<span class="sub">O problema da devolução e a proposta do Buyitly</span></span></li>
    <li><span class="num">02</span><span class="lbl">A situação-problema<span class="sub">Por que este caso importa para a IHC</span></span></li>
    <li><span class="num">03</span><span class="lbl">Stakeholders e interesses em tensão<span class="sub">Quem participa e o que cada parte disputa</span></span></li>
    <li><span class="num">04</span><span class="lbl">Contexto real de uso<span class="sub">Ação situada e design contextual</span></span></li>
    <li><span class="num">05</span><span class="lbl">Metas e critérios de qualidade<span class="sub">Eficácia, eficiência, satisfação e comunicabilidade</span></span></li>
    <li><span class="num">06</span><span class="lbl">Prototipação do fluxo completo<span class="sub">Das telas iniciais à exceção e ao fechamento</span></span></li>
    <li><span class="num">07</span><span class="lbl">Fundamentação teórica<span class="sub">Affordances, golfos e engenharia semiótica</span></span></li>
    <li><span class="num">08</span><span class="lbl">Avaliação da proposta e conclusão<span class="sub">Como testar e o que aprendemos</span></span></li>
  </ol>`,
        },

        // 3 — INTRODUÇÃO pt1
        {
          type: "text",
          kicker: "01 · Introdução",
          title: "O Contexto 4: logística reversa e devolução de produtos",
          paragraphs: [
            `O comércio eletrônico transformou a compra em um ato quase instantâneo: poucos toques separam o desejo de um produto da confirmação do pedido. Mas essa fluidez tem uma contraparte pouco explorada pelo design de interfaces — o momento em que a compra <strong>dá errado</strong>. O produto chega com defeito, em tamanho incorreto, diferente do anunciado, ou simplesmente o cliente se arrepende. É nesse ponto que entra a logística reversa, o processo de trazer o item de volta ao vendedor e devolver o valor pago ao consumidor.`,
            `O Contexto 4, objeto deste seminário, trata exatamente desse fluxo, materializado no aplicativo fictício <strong>Buyitly</strong>. Diferentemente da jornada de compra, amplamente estudada e otimizada pelas empresas, a jornada de devolução costuma ser tratada como um apêndice do sistema: menos visível, menos polida, frequentemente terceirizada para um canal de atendimento humano lento e genérico.`,
          ],
        },

        // 4 — INTRODUÇÃO síntese
        {
          type: "text",
          emphasis: true,
          kicker: "01 · Introdução",
          title: "A premissa central",
          paragraphs: [
            `Se a compra é desenhada para gerar confiança e desejo, a devolução precisa ser desenhada para <em>preservar</em> essa confiança quando algo sai do previsto. É esse fluxo — solicitar, escolher o método de envio, acompanhar o status, lidar com uma exceção e, por fim, ser reembolsado — que analisamos e prototipamos ao longo desta apresentação.`,
          ],
        },

        // 5 — SITUAÇÃO-PROBLEMA pt1
        {
          type: "text",
          kicker: "02 · Situação-problema",
          title: "Por que isso importa na visão da IHC",
          paragraphs: [
            `Um princípio central da Interação Humano-Computador é que as Tecnologias de Informação e Comunicação não são meras ferramentas neutras que executam tarefas predefinidas: elas <strong>transformam a prática social</strong> e reconfiguram rotinas inteiras. Quando um aplicativo de e-commerce se torna o único caminho possível para resolver um problema — como devolver um produto — a tecnologia deixa de apenas mediar a ação e passa a <em>governá-la</em>. O usuário não pode simplesmente "devolver o produto"; ele só pode fazer aquilo que a interface permite, na ordem que a interface impõe.`,
            `É exatamente nesse ponto que reside a importância do Contexto 4. Um processo de devolução mal desenhado — com passos ambíguos, falta de feedback sobre o status do reembolso, ou barreiras artificiais como a exigência de contato telefônico — não é apenas um inconveniente pontual. Ele comunica ao usuário, de forma silenciosa mas eficaz, que a empresa não está genuinamente do seu lado no momento em que ele mais precisa de suporte.`,
          ],
        },

        // 6 — SITUAÇÃO-PROBLEMA síntese
        {
          type: "text",
          emphasis: true,
          kicker: "02 · Situação-problema",
          title: "O que está realmente em jogo",
          paragraphs: [
            `A confiança do consumidor não se constrói apenas na compra bem-sucedida, mas sobretudo na forma como a plataforma responde quando as coisas <strong>não</strong> saem como esperado. Um fluxo de devolução frustrante quebra essa confiança de maneira desproporcional ao tamanho do problema original.`,
          ],
        },

        // 7 — STAKEHOLDERS
        {
          type: "cards",
          kicker: "03 · Stakeholders",
          title: "Identificação dos stakeholders",
          html: `
  <div class="card-grid">
    <div class="card"><h3>Consumidor final (usuário)</h3><p>A pessoa que comprou o produto e agora precisa devolvê-lo. Busca um processo rápido, claro e com o mínimo de esforço cognitivo e burocrático possível, especialmente por já estar em uma situação de insatisfação.</p></div>
    <div class="card"><h3>Equipe de suporte / atendimento</h3><p>Responsável por intermediar casos que a interface não resolve sozinha. Seu interesse é reduzir o volume de chamados repetitivos, o que só ocorre se o autoatendimento digital for realmente eficaz.</p></div>
    <div class="card"><h3>Setor de logística e estoque</h3><p>Cuida do recebimento físico do produto devolvido, da conferência de estado e da reintegração (ou descarte) do item. Precisa de informações precisas e antecipadas sobre o que está retornando.</p></div>
    <div class="card"><h3>Gestores do e-commerce</h3><p>Responsáveis pelos indicadores de negócio: custo logístico, taxa de fraude em devoluções, satisfação do cliente (NPS) e retenção. Equilibram a experiência do usuário com a sustentabilidade financeira da operação.</p></div>
  </div>`,
        },

        // 8 — INTERESSES EM TENSÃO pt1
        {
          type: "text",
          kicker: "03 · Stakeholders",
          title: "Interesses em tensão",
          paragraphs: [
            `Nenhum sistema de devolução é neutro: cada decisão de design distribui custo e conveniência entre as partes envolvidas. De um lado, o <strong>usuário</strong> quer um reembolso rápido, sem atrito, sem precisar justificar-se extensivamente e, idealmente, sem sair de casa. Do outro, a <strong>empresa</strong> precisa manter controle sobre o processo: verificar se o produto realmente será devolvido em condições aceitáveis, mitigar fraudes e minimizar o custo logístico de cada devolução, que muitas vezes supera o valor do produto.`,
            `Esse é o cerne do que projetar uma interface de devolução realmente significa: <em>decidir quem ganha facilidade e quem assume o custo da ação</em>. Uma interface que exige múltiplas etapas de verificação protege a empresa, mas transfere carga cognitiva e tempo ao usuário. Uma interface que aprova reembolsos automaticamente protege o usuário, mas expõe a empresa a risco financeiro maior.`,
          ],
        },

        // 9 — INTERESSES EM TENSÃO síntese
        {
          type: "text",
          emphasis: true,
          kicker: "03 · Stakeholders",
          title: "O equilíbrio do Buyitly",
          paragraphs: [
            `O Buyitly busca um meio-termo: automatiza o que pode ser automatizado com segurança — geração de código de postagem, acompanhamento por timeline — e reserva a intervenção humana para os casos de exceção genuína, como um problema no envio detectado apenas durante o transporte.`,
          ],
        },

        // 10 — CONTEXTO REAL DE USO pt1
        {
          type: "text",
          kicker: "04 · Contexto de uso",
          title: "Contexto real de uso: ação situada",
          paragraphs: [
            `A literatura de IHC, a partir do conceito de <strong>Ação Situada</strong> proposto por Lucy Suchman, nos alerta contra tratar o usuário como uma entidade abstrata que segue planos racionais e lineares. Na prática, a ação humana é moldada momento a momento pelas circunstâncias concretas em que ocorre — e isso é particularmente verdadeiro no cenário de uma devolução.`,
            `O usuário que abre o Buyitly para devolver um produto raramente está em um estado neutro. Ele frequentemente está <strong>frustrado</strong> (o produto não atendeu à expectativa), com <strong>pressa</strong> (quer resolver o problema entre uma tarefa e outra do dia) e <strong>inseguro</strong> (não sabe se vai realmente receber o dinheiro de volta, nem em quanto tempo). Esse estado emocional e temporal deve orientar decisões centrais de design.`,
          ],
        },

        // 11 — CONTEXTO REAL DE USO síntese
        {
          type: "text",
          emphasis: true,
          kicker: "04 · Contexto de uso",
          title: "Mobile, com distrações reais",
          paragraphs: [
            `Grande parte dessas interações ocorre em contexto <strong>mobile</strong>, muitas vezes com distrações no ambiente — em pé, em um transporte público, entre outras tarefas. O Design Contextual reforça que entender esse cenário real de uso é o que diferencia uma interface tecnicamente funcional de uma interface genuinamente utilizável.`,
          ],
        },

        // 12 — METAS E CRITÉRIOS
        {
          type: "criteria",
          kicker: "05 · Metas de qualidade",
          title: "De metas amplas a critérios mensuráveis",
          intro: `Uma meta ampla como "melhorar a experiência de devolução" não é acionável por si só. Ela precisa ser desdobrada em critérios de qualidade concretos e observáveis:`,
          rows: [
            {
              label: "Eficácia",
              desc: "O usuário consegue gerar o código de postagem e concluir a solicitação de devolução sem precisar contatar o suporte humano em nenhum momento do fluxo padrão.",
            },
            {
              label: "Eficiência",
              desc: "Redução do número de passos e telas necessárias entre a decisão de devolver e a confirmação da solicitação, minimizando cliques e tempo de tarefa.",
            },
            {
              label: "Satisfação",
              desc: "O usuário sente confiança de que o estorno realmente ocorrerá — satisfação pragmática pela tarefa cumprida e hedônica pela sensação de controle e tranquilidade.",
            },
            {
              label: "Comunicabilidade",
              desc: "A política de devolução (prazos, condições, responsabilidades) é comunicada com clareza suficiente para que o usuário não precise interpretar ou adivinhar regras.",
            },
          ],
        },

        // 13 — PONTO DE PARTIDA (texto + figma banner)
        {
          type: "text",
          kicker: "06 · Prototipação",
          title: "O ponto de partida: clareza na interface inicial",
          figmaBanner: `

      const TOTAL = slides.length;
      let current = 0;
      const deck = document.getElementById("deck");
      const pagenum = document.getElementById("pagenum");
      const progressBar = document.getElementById("progress-bar");

      function renderImgFeature(slide) {
        const cls = slide.single
          ? "img-feature-block single"
          : "img-feature-block";
        const imgs = slide.images
          .map(
            (im) => `
    <figure class="${cls}">
      <img src="${im.src}" alt="${im.alt}" loading="lazy">
      <figcaption>${im.caption}</figcaption>
    </figure>`,
          )
          .join("");
        return `<div class="img-feature-row">${imgs}</div>`;
      }

      function buildSlideEl(slide, idx) {
        const el = document.createElement("section");
        el.className = "slide " + (slide.type === "cover" ? "cover" : "");
        el.dataset.index = idx;

        if (slide.type === "cover") {
          el.innerHTML = slide.html;
          return el;
        }

        let inner = `<div class="content-wrap">`;
        if (slide.kicker)
          inner += `<span class="kicker">${slide.kicker}</span>`;
        if (slide.title) inner += `<h2 class="slide-title">${slide.title}</h2>`;

        if (slide.type === "toc" || slide.type === "cards") {
          inner += slide.html;
        } else if (slide.type === "criteria") {
          inner += `<p class="crit-intro">${slide.intro}</p>`;
          inner +=
            `<div class="crit-list">` +
            slide.rows
              .map(
                (r) =>
                  `<div class="crit-row"><div class="label">${r.label}</div><div class="desc">${r.desc}</div></div>`,
              )
              .join("") +
            `</div>`;
        } else if (slide.type === "text") {
          if (slide.figmaBanner)
            inner += `<div class="figma-banner-text">${slide.figmaBanner}</div>`;
          const wrapCls = slide.emphasis
            ? "slide-body emphasis-wrap"
            : "slide-body";
          inner +=
            `<div class="${wrapCls}">` +
            slide.paragraphs.map((p) => `<p>${p}</p>`).join("") +
            `</div>`;
        } else if (slide.type === "img-feature") {
          inner += renderImgFeature(slide);
        } else if (slide.type === "refs") {
          if (slide.lead) inner += `<p class="refs-lead">${slide.lead}</p>`;
          if (slide.refText)
            inner += `<div class="ref-box">${slide.refText}</div>`;
        }
        inner += `</div>`;
        el.innerHTML = inner;
        return el;
      }

      slides.forEach((s, i) => deck.appendChild(buildSlideEl(s, i)));
      const slideEls = Array.from(document.querySelectorAll(".slide"));

      function fitSlide(el) {
        const wrap = el.querySelector(".content-wrap");
        if (!wrap) return;
        wrap.style.transform = "scale(1)";
        requestAnimationFrame(() => {
          const avail = wrap.clientHeight;
          const need = wrap.scrollHeight;
          if (need > avail + 1) {
            const scale = Math.max(0.6, avail / need);
            wrap.style.transform = `scale(${scale})`;
          }
        });
      }

      function show(idx) {
        if (idx < 0 || idx >= TOTAL) return;
        slideEls[current].classList.remove("active");
        current = idx;
        slideEls[current].classList.add("active");
        pagenum.textContent = current + 1 + " / " + TOTAL;
        progressBar.style.width = ((current + 1) / TOTAL) * 100 + "%";
        fitSlide(slideEls[current]);
      }

      function next() {
        show(current + 1);
      }
      function prev() {
        show(current - 1);
      }

      document.getElementById("zoneRight").addEventListener("click", next);
      document.getElementById("zoneLeft").addEventListener("click", prev);

      document.addEventListener("keydown", (e) => {
        const k = e.key.toLowerCase();
        if (k === "d" || k === "arrowright") {
          e.preventDefault();
          next();
        } else if (k === "a" || k === "arrowleft") {
          e.preventDefault();
          prev();
        }
      });

      window.addEventListener("resize", () => fitSlide(slideEls[current]));

      show(0);
    </script>
